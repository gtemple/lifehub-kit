<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifehub</title>
<link rel="icon" href="/static/sun.svg" type="image/svg+xml">
<link rel="icon" href="/static/sun.ico" sizes="any">
<style>
  :root { --bg: #faf9f7; --card: #ffffff; --text: #1f1d1a; --muted: #6f6a63; --line: #e7e3dc; --accent: #b5651d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --card: #201f1c; --text: #ece8e1; --muted: #9a948b; --line: #33302b; --accent: #e3a35b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 16px; max-width: 1200px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 20px; }
  header form button { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; padding: 0 16px 32px; max-width: 1200px; margin: 0 auto; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px 12px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  a { color: var(--text); text-decoration: none; }
  a:hover { color: var(--accent); }
  .unread a { font-weight: 600; }
  .unread::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: middle; }
  .meta { color: var(--muted); font-size: 13px; }
  .snippet { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .empty { color: var(--muted); padding: 12px 0; }
  .login { max-width: 320px; margin: 15vh auto; padding: 0 16px; }
  .login input { width: 100%; padding: 8px; margin: 4px 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; }
  .login button { padding: 8px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
