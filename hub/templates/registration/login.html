<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeHub · log in</title>
<link rel="icon" href="/static/sun.svg" type="image/svg+xml">
<link rel="icon" href="/static/sun.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* the Vaporwave login.exe; values from design/tokens.json */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(180deg, #ff9ad5 0%, #c79bff 38%, #8fd3ff 100%); color: #2b1250; font: 14px/1.45 'Space Mono', ui-monospace, monospace; }
  .win { width: 100%; max-width: 400px; background: #f4e9ff; border: 2px solid; border-color: #ffffff #2b1250 #2b1250 #ffffff; box-shadow: 8px 8px 0 #2b1250; }
  .bar { padding: 4px 10px; background: linear-gradient(90deg, #ff71ce, #b967ff); color: #fff; font: 22px VT323, monospace; }
  form { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font: 22px VT323, monospace; }
  input { min-height: 40px; padding: 0 10px; background: #fff; color: #2b1250; font: 14px 'Space Mono', monospace; border: 2px solid; border-color: #6b4b8f #ffffff #ffffff #6b4b8f; }
  button { align-self: flex-start; min-height: 40px; padding: 0 18px; background: #05ffa1; color: #2b1250; font: 24px VT323, monospace; cursor: pointer; border: 2px solid; border-color: #ffffff #2b1250 #2b1250 #ffffff; }
  .err { padding: 6px 10px; background: #ff71ce; border: 2px solid #2b1250; }
  :focus-visible { outline: 2px dashed #2b1250; outline-offset: 2px; }
</style>
</head>
<body>
<div class="win">
  <div class="bar">login.exe · LIFEHUB</div>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p class="err" role="alert">wrong username or password.</p>{% endif %}
    <label>username <input name="username" autofocus autocomplete="username"></label>
    <label>password <input name="password" type="password" autocomplete="current-password"></label>
    <button>LOG IN ↵</button>
  </form>
</div>
</body>
</html>
