# Copy to lifehub.toml (gitignored) and fill in. The /setup command in Claude Code does this for you.
secret_key = "generate with: python -c 'import secrets; print(secrets.token_urlsafe(50))'"

# lets scripts read /api/items/ with 'Authorization: Bearer <api_token>'
api_token = "generate the same way"

# local model for private data (mail, notes, calendar): https://ollama.com
# in Docker: "http://ollama:11434" (the ollama profile) or "http://host.docker.internal:11434" (Ollama on the host)
ollama_url = "http://localhost:11434"
ollama_model = "qwen3.5:4b"

# optional: Gemini for news, the AI daily card, and private data when allowed in Settings
# gemini_api_key = "..."

time_zone = "America/Toronto"  # IANA name

# the Server page: containers, compose stacks, pm2 apps and Ollama on this machine. Needs Docker; in Docker also compose.server.yml
# server = true

[weather]
city = "Your City"
lat = 0.0
lon = 0.0

# Gmail / Google Workspace over IMAP. Needs 2-step verification and an
# app password: https://myaccount.google.com/apppasswords
[[email]]
name = "Personal"
user = "you@gmail.com"
password = "app password"

# Google Calendar: Settings > the calendar > Integrate calendar > Secret address in iCal format
# [[calendar]]
# name = "Personal"
# url = "https://calendar.google.com/calendar/ical/.../basic.ics"

[[feed]]
name = "Hacker News"
topic = "Tech"
url = "https://hnrss.org/frontpage?points=150"

[[feed]]
name = "BBC World"
topic = "World"
url = "https://feeds.bbci.co.uk/news/world/rss.xml"
